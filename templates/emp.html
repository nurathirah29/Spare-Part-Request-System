<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Item Request Form</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='emp.css') }}">
        <link href="/static/fontawesome/css/all.min.css" rel="stylesheet">
        <link href="/static/select2.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
        <!-- <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"> -->
        <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> -->

        <script src="/static/jquery.min.js"></script>
        <script src="/static/select2.min.js"></script>
        <!-- <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script> -->
        <!-- <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script> -->
    </head>
    <body>
        <style>
            .select2-container--default .select2-selection--single {
                height: 48px;
                border: 2px solid #ccc;
                border-radius: 12px;
                padding: 10px 14px;
                font-size: 16px;
                line-height: 1.5;
                transition: border-color 0.3s ease, box-shadow 0.3s ease;
            }

            .select2-container--default .select2-selection--single:focus,
            .select2-container--default .select2-selection--single:hover {
                border-color: #007bff;
                box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
                outline: none;
            }

            .select2-container--default .select2-selection__arrow {
                top: 10px;
                right: 10px;
            }

            .select2-dropdown {
                border-radius: 12px;
                border: 2px solid #ccc;
                font-size: 16px;
            }

            .select-btn {
                background-color: #4CAF50;
                color: white;
                border: none;
                padding: 6px 12px;
                border-radius: 4px;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }

            .select-btn:hover {
                background-color: #45a049;
            }
        </style>

        <!-- Start Page -->
        <div id="start-page" class="fullscreen start-screen">
            <h1>Spare Part/Others Internal Issue</h1>
            <br>
            <div class="input-group">
                <i class="fa fa-user icon"></i>
                <input type="text" id="emp_id" placeholder="Card No." required />
            </div>
            <div class="start-button-container">
                <button onclick="handleStart()">Start</button>
            </div>
        </div>
        
        <!-- Main Page - Form and Table -->
        <div id="main-page" class="fullscreen main-screen" style="display: none;">
            <div class="user-info">
                <i class="fa fa-user"></i>
                <span><strong><span id="empIdDisplay"></span></strong></span>
            </div> 
            
            <div class="content-container">
                <!-- Form Container (Left side) -->
                <div class="form-container">
                    <!-- Form Fields -->
                    <div class="form-group">
                        <div class="form-row">
                            <label for="barcode">Spare Part/Others:<span class="required">*</span></label>
                            <button class="item-list-btn" onclick="openItemList()">List</button>
                            <div class="input-group">
                                <input type="text" id="barcode" placeholder="Click List button">
                            </div>
                        </div>

                        <div class="form-row">
                            <label for="quantity">Quantity:<span class="required">*</span></label>
                            <input type="text" id="quantity" placeholder="Enter quantity">
                            
                            <label for="dept">Request Section:<span class="required">*</span></label>
                            <select id="dept" class="select-search">
                                <option value="">Select</option>
                                <!-- Options will be populated dynamically -->
                            </select>
                        </div>

                        <button class="add-item-btn" onclick="addToList()">Add Item</button>
                        <button class="reset-item-btn" onclick="resetForm()">Reset</button>
                    </div>
                </div>

                <!-- Table Container (Right side) -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Request Section</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="itemsInRequest">
                            <!-- Dynamically Added Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Remark Section -->
            <div class="remark-container">
                <label for="remark">Remark:</label>
                <textarea id="remark" rows="3" placeholder="Additional Notes (or -)"></textarea>
            </div>

            <!-- Submit and Cancel Buttons -->
            <div class="button-group">
                <button class="cancel-button" onclick="goToStartPage()">Cancel</button>
                <button class="submit-button" onclick="submitAllItems()">Submit</button>
            </div>

            <div id="confirmation-message"></div>
        </div>
        
        <div class="notification-bar" id="notificationBar" style="display: none;">
            <span class="notification-text">
                <strong>Success!</strong> Your request has been submitted.
            </span>
            <span class="reference-number">
                Reference Number: <span id="referenceNumber"></span>
            </span>
            <span class="close-btn" onclick="closeNotification()">&times;</span>
        </div>        

        <!-- Item List Modal -->
        <div id="itemListModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn" onclick="closeItemListModal()">&times;</span>
                <h2>Items List</h2>
                <br>
                <input type="text" id="itemListSearch" placeholder="Search item here..." onkeyup="filterItems()">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Catalog Number</th>
                            <th>Item Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="itemListTable">
                        <!-- Items will be dynamically added here -->
                    </tbody>
                </table>
            </div>
        </div>

        <script>
            function openItemList() {
                if (typeof openItemListModal === 'function') {
                    openItemListModal();
                } else {
                    console.error('openItemListModal is not defined yet');
                }
            }

            function closeItemListModal() {
                document.getElementById('itemListModal').style.display = 'none';
            }

            function selectItem(barcode) {
                document.getElementById('barcode').value = barcode;
                if (typeof scanItem === 'function') {
                    scanItem();
                }
                closeItemListModal();
            }

            window.addEventListener('DOMContentLoaded', function() {
                // Auto-capitalize employee ID input
                const empIdInput = document.getElementById('emp_id');
                if (empIdInput) {
                    empIdInput.addEventListener('input', function() {
                        this.value = this.value.toUpperCase();
                    });

                    empIdInput.addEventListener('keydown', function(event) {
                        if (event.key === 'Enter') {
                            handleStart();
                        }
                    });
                }

                let barcodeSearchTimeout;
                
                const barcodeInput = document.getElementById('barcode');
                if (barcodeInput) {
                    barcodeInput.addEventListener('input', function() {
                        const barcodeValue = this.value.toUpperCase();
                        this.value = barcodeValue;
                        
                        clearTimeout(barcodeSearchTimeout);

                        if (barcodeValue.length >= 3) {
                            barcodeSearchTimeout = setTimeout(() => {
                                if (typeof scanItem === 'function') {
                                    scanItem();
                                }
                            }, 500); 
                        }
                    });

                    barcodeInput.addEventListener('keydown', function(event) {
                        if (event.key === 'Enter') { 
                            event.preventDefault();
                            clearTimeout(barcodeSearchTimeout); 
                            if (typeof scanItem === 'function') {
                                scanItem();
                            }
                            const quantityInput = document.getElementById('quantity');
                            if (quantityInput) {
                                quantityInput.focus();
                            }
                        }
                    });
                }

                const quantityInput = document.getElementById('quantity');
                if (quantityInput) {
                    quantityInput.addEventListener('keydown', function(event) {
                        if (event.key === 'Enter') {
                            event.preventDefault(); 
                            const deptSelect = document.getElementById('dept');
                            if (deptSelect) {
                                deptSelect.focus();
                            }
                        }
                    });
                }
            });
        </script>

        <script>
            $(document).ready(function () {
                $('#dept').select2({
                    placeholder: "Select department",
                    allowClear: true,
                    width: '100%'
                });
            });
        </script>

        <script src="{{ url_for('static', filename='emp_script.js') }}"></script>
    </body>
</html>
